{% extends "base.html" %}
{% block titulo %}Mi cuenta{% endblock %}
{% block contenido %}
<div class="panel" style="max-width:460px">
  <h1>Mi cuenta</h1>
  <p class="suave">{{ usuario.nombre }} · {{ usuario.perfil_nombre }}</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div style="margin-bottom:10px"><label for="actual">Clave actual</label>
      <input type="password" id="actual" name="actual" autocomplete="current-password" required></div>
    <div style="margin-bottom:12px"><label for="nueva">Nueva clave (mínimo 10 caracteres)</label>
      <input type="password" id="nueva" name="nueva" autocomplete="new-password" minlength="10" required></div>
    <button class="btn prim" type="submit">Cambiar clave</button>
  </form>
</div>
<div class="panel mt-grande" style="max-width:720px">
  <h2>Colores</h2>
  <p class="suave peq" style="margin:0">Elige los colores con que ves el sistema. Solo cambian para ti.</p>
  <form method="post" id="form-paleta">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="paletas" role="radiogroup" aria-label="Paleta de colores">
      {% for k, nombre in paletas.items() %}
      <label class="paleta"><input type="radio" name="paleta" value="{{ k }}" {{ 'checked' if (usuario.paleta or 'azul') == k }}>
        <span class="muestra" aria-hidden="true">{% for c in muestras[k] %}<span style="background:{{ c }}"></span>{% endfor %}</span>
        {{ nombre }}</label>
      {% endfor %}
    </div>
    <button class="btn prim" type="submit">Guardar colores</button>
  </form>
</div>
<script>
// Vista previa al elegir: la página toma los colores al tiro; «Guardar colores» los deja fijos
document.querySelectorAll('#form-paleta input[name=paleta]').forEach(r => r.addEventListener('change', () => {
  document.documentElement.dataset.paleta = r.value === 'azul' ? '' : r.value;
}));
</script>
{% endblock %}
